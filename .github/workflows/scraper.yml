name: Job Scraper Automation

on:
  schedule:
    # 매일 아침 08:00 KST (UTC 23:00) 자동 실행
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Scraper and Send Mail
      env:
        NAVER_USER: ${{ secrets.NAVER_USER }}
        NAVER_PASSWORD: ${{ secrets.NAVER_PASSWORD }}
      run: python main.py

    - name: Commit and Push Changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add README.md latest_jobs.csv || true
        git commit -m "Auto update: 최신 통합 공고 업데이트 ($(date +'%Y-%m-%d'))" || exit 0
        git push
