name: Job Scraper Automation

on:
  schedule:
    - cron: '0 0 * * *' # 매일 아침 9시 (KST)
  workflow_dispatch: # 수동 실행 버튼

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas beautifulsoup4

      - name: Run Scraper and Send Mail
        env:
          NAVER_USER: ${{ secrets.NAVER_USER }}
          NAVER_PASSWORD: ${{ secrets.NAVER_PASSWORD }}
        run: |
          python main.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add latest_jobs.csv README.md
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto update: 링커리어 및 자소설닷컴 공고 업데이트"
            git pull --rebase origin main
            git push origin main
          fi
